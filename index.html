<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Use Guidelines for Programming Students</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Academic integrity and best practices for using AI in computer science courses.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Loading / Memuat...</div>
  <script>
    window.$docsify = {
      name: 'CS AI Guidelines',
      repo: '', 
      
      // Amankan path deploy untuk sub-folder GitHub Pages
      basePath: window.location.pathname.lastIndexOf('/') === 0 ? '' : window.location.pathname.substr(0, window.location.pathname.lastIndexOf('/') + 1),

      // Konfigurasi routing multi-bahasa yang tepat untuk Docsify
      alias: {
        '/': '/id/README.md',       // Jika buka halaman utama, langsung muat konten Indonesia
        '/en/': '/en/README.md',   // Path untuk Bahasa Inggris
        '/id/': '/id/README.md'    // Path untuk Bahasa Indonesia
      },

      maxLevel: 3,
      subMaxLevel: 3,
      loadSidebar: false
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
