<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Use Guidelines for Programming Students</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Academic integrity and best practices for using AI in computer science courses.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Loading / Memuat...</div>
  <script>
    window.$docsify = {
      name: 'CS AI Guidelines',
      repo: '', // Opsional: Isi dengan URL repo GitHub Anda
      
      // Konfigurasi Multi-Bahasa
      nameLink: {
        '/en/': '#/en/',
        '/id/': '#/id/',
        '/': '/'
      },
      
      // Daftar bahasa yang tersedia untuk drop-down selector
      fallbackLanguages: ['en'],
      routes: {
        '/en/': 'English',
        '/id/': 'Bahasa Indonesia'
      },

      // Pengaturan tampilan single-page per bahasa
      maxLevel: 3,
      subMaxLevel: 3,
      loadSidebar: false
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugin untuk memunculkan drop-down pemilih bahasa -->
  <script src="//cdn.jsdelivr.net/npm/docsify-language-selector/dist/index.min.js"></script>
  <!-- Plugin Coder Highlighter -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
