<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Panduan Penggunaan AI - DDP 1</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Aturan akademik penggunaan AI untuk kelas Dasar-Dasar Pemrograman 1.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Tema Ringan Docsify -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Memuat Panduan...</div>
  <script>
    window.$docsify = {
      name: 'DDP 1 AI Guidelines',
      repo: '', // Opsional: Masukkan link repositori GitHub Anda jika ingin memunculkan ikon GitHub
      
      // Amankan path deploy sub-folder GitHub Pages
      basePath: window.location.pathname.lastIndexOf('/') === 0 ? '' : window.location.pathname.substr(0, window.location.pathname.lastIndexOf('/') + 1),

      // Konfigurasi Navigasi Single Page
      maxLevel: 3,       // Otomatis membuat menu navigasi samping dari heading markdown
      subMaxLevel: 3,    // Memunculkan sub-heading di menu samping
      loadSidebar: false // Dimatikan karena kita menggunakan sistem auto-render dari satu halaman tunggal
    }
  </script>
  <!-- Mesin Utama Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugin Pewarnaan Sintaks Kode (Highlighting) -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
</body>
</html>
